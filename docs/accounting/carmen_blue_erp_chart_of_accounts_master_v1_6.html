      });

      const filteredAccounts = useMemo(() => {
        return accounts.filter(acc => {
          const matchesSearch = 
            acc.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
            acc.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) ||
            acc.nameTh.toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesCategory = selectedCategory === 'ALL' || acc.category === selectedCategory;
          const matchesType = selectedType === 'ALL' || acc.type === selectedType;
          const matchesStatus = selectedStatus === 'ALL' || (selectedStatus === 'ACTIVE' ? acc.active : !acc.active);

          return matchesSearch && matchesCategory && matchesType && matchesStatus;
        });
      }, [accounts, searchQuery, selectedCategory, selectedType, selectedStatus]);

        setEditingAccount(JSON.parse(JSON.stringify(acc)));
        setIsFullScreenFormOpen(true);
      };

      // Delete Account Logic
      const handleDeleteAccount = (acc) => {
        if (acc.isUsed) {
          setWarningModal({
            open: true,
            title: lang === 'th' ? 'ไม่สามารถลบรหัสบัญชีได้' : 'Cannot Delete Account Code',

              : `Account Code ${acc.code} (${acc.nameEn}) has existing document postings or transaction records in the system (including external interfaces). It cannot be deleted. Please set its status to In-Active instead.`
          });
          return;
        }

        setConfirmDeleteModal({ open: true, account: acc });

      const executeDeleteAccount = () => {
        if (!confirmDeleteModal.account) return;
        const targetCode = confirmDeleteModal.account.code;
        setAccounts(prev => prev.filter(a => a.code !== targetCode));

        if (isFullScreenFormOpen) {

          alert(lang === 'th' ? 'กรุณาเลือกหมวดบัญชี (Category)!' : 'Please select Account Category!');

    function FullScreenAccountEditor({ account, lang, onClose, onSave, onDelete }) {
      const isExisting = account.isUsed || account.code !== '';
      
      const [formData, setFormData] = useState({ 
        dimConfigs: account.dimConfigs || {},
        groupingPath: account.groupingPath || [],
        currentGroup: account.currentGroup || null,
        ...account 
      });

      const [activeDimModal, setActiveDimModal] = useState(null);
      const [isTreeModalOpen, setIsTreeModalOpen] = useState(false);

      const currentNature = formData.category ? (CATEGORIES[formData.category]?.nature || '-') : '-';

      const [attrKey, setAttrKey] = useState('');
      const [attrVal, setAttrVal] = useState('');

      const handleCategoryChange = (newCat) => {
        if (account.isUsed) return;
        setFormData(prev => ({ ...prev, category: newCat }));
      };

      const handleTypeChange = (newType) => {
        if (account.isUsed) return;
        setFormData(prev => ({ ...prev, type: newType }));
      };

      const handleDeptToggle = (deptCode) => {
        setFormData(prev => {
          const exists = prev.allowedDepts.includes(deptCode);
          const newDepts = exists 
            ? prev.allowedDepts.filter(d => d !== deptCode)
            : [...prev.allowedDepts, deptCode];
          return { ...prev, allowedDepts: newDepts };
        });
      };

      const handleDimToggle = (dimId) => {
        setFormData(prev => {
          const exists = prev.allowedDims.includes(dimId);
          const newDims = exists 
            ? prev.allowedDims.filter(d => d !== dimId)
            : [...prev.allowedDims, dimId];
          return { ...prev, allowedDims: newDims };
        });
      };

      const handleSaveDimConfig = (dimId, selectedCodes, defaultCode) => {
        setFormData(prev => ({
          ...prev,
          dimConfigs: {
            ...prev.dimConfigs,
            [dimId]: {
              selectedCodes: selectedCodes,
              defaultCode: defaultCode
            }
          }
        }));
        setActiveDimModal(null);
      };

      const handleAddAttribute = () => {
        if (!attrKey || !attrVal) return;
        setFormData(prev => ({
          ...prev,
          attributes: { ...prev.attributes, [attrKey]: attrVal }
        }));
        setAttrKey('');
        setAttrVal('');
      };

      const handleRemoveAttribute = (key) => {
        setFormData(prev => {
          const updated = { ...prev.attributes };
          delete updated[key];
          return { ...prev, attributes: updated };
        });
      };

      const handleSelectTreeGroup = (pathList, targetGroup) => {
        setFormData(prev => ({
          ...prev,
          groupingPath: pathList,
          currentGroup: targetGroup
        }));
        setIsTreeModalOpen(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-app-bg flex flex-col w-full h-full overflow-hidden animate-in fade-in duration-200">
          
          {/* Header */}
          <div className="px-8 py-4 border-b border-app-border bg-app-card flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-4">
              <button 
                onClick={onClose}
                className="p-2 rounded-lg bg-secondary hover:bg-accent text-foreground transition flex items-center gap-2 text-sm font-semibold"
              >
                <i data-lucide="arrow-left" className="w-4 h-4"></i>
                <span>{lang === 'th' ? 'กลับหน้าผังบัญชี' : 'Back to COA Master'}</span>
              </button>
              <div className="h-6 w-px bg-app-border"></div>
              <div>
                <h2 className="text-lg font-bold flex items-center gap-2">
                  <span>{isExisting ? (lang === 'th' ? `รายละเอียดรหัสบัญชี: ${account.code}` : `Account Code Details: ${account.code}`) : (lang === 'th' ? 'สร้างรหัสบัญชีใหม่ (Full Page Editor)' : 'Create New Account Code (Full Page)')}</span>
                  <span className="text-xs px-2 py-0.5 rounded bg-blue-500/10 text-blue-600 font-mono font-normal">
                    Carmen Blue Master Definition
                  </span>
                </h2>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Delete Button inside Editor Header */}
              {isExisting && (
                <button
                  type="button"
                  onClick={() => onDelete(formData)}
                  className="px-3.5 py-2 text-sm font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition border border-rose-200 dark:border-rose-900 flex items-center gap-1.5"
                  title={formData.isUsed ? "Cannot delete if used in transactions" : "Delete Account Code"}
                >
                  <i data-lucide="trash-2" className="w-4 h-4"></i>
                  <span>{lang === 'th' ? 'ลบรหัสบัญชี' : 'Delete Code'}</span>
                </button>
              )}

              <button
                onClick={onClose}
                className="px-4 py-2 text-sm font-medium text-foreground hover:bg-secondary rounded-lg transition"
              >
                {lang === 'th' ? 'ยกเลิก' : 'Cancel'}
              </button>
              
              {/* Primary Save Action */}
              <button
                onClick={() => onSave(formData)}
                className="px-6 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-md flex items-center gap-2"
              >
                <i data-lucide="save" className="w-4 h-4"></i>
                <span>{lang === 'th' ? 'บันทึกข้อมูลรหัสบัญชี' : 'Save & Update Code'}</span>
              </button>
            </div>

                      <i data-lucide={formData.active ? "check-circle-2" : "pause-circle"} className="w-6 h-6"></i>
                    </div>
                    <div>
                      <div className="text-base font-bold">{lang === 'th' ? 'สถานะใช้งานบัญชี (Active Status)' : 'Account Active Status'}</div>
                      <div className="text-xs text-muted-foreground">
                        {lang === 'th' ? 'ปิดการใช้งานหากมียอดคงเหลือเป็น 0 เท่านั้น (Validation Rule 6.2)' : 'Deactivate only when current balance is 0 THB'}

                    </div>

                    <div className="w-14 h-7 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-emerald-500"></div>
                  </label>
                </div>

                {/* Account Identifiers Grid */}
                <div className="bg-app-card p-6 rounded-xl border border-app-border shadow-sm space-y-6">

                      </label>
                      <input

                      >
                        <option value="">{lang === 'th' ? '-- เลือกหมวดบัญชี (Select Category) --' : '-- Select Category --'}</option>

                      </label>
                      <input 
                        type="text" 
                        value={formData.nameEn}
                        onChange={(e) => setFormData({...formData, nameEn: e.target.value})}
                        placeholder="e.g. ROOM REVENUE - GUEST ROOMS"
                        className="w-full px-3.5 py-2.5 text-sm rounded-lg bg-app-card border border-app-border focus:outline-none focus:ring-2 focus:ring-blue-500"

                        <option value="">{lang === 'th' ? '-- เลือกประเภทบัญชี (Select Type) --' : '-- Select Type --'}</option>

                              <i data-lucide="chevron-right" className="w-3.5 h-3.5 text-muted-foreground"></i>

                    ) : (

                      </div>

    function DimensionSubCodesModal({ dimension, currentConfig, lang, onClose, onSave }) {
      const [selectedCodes, setSelectedCodes] = useState(currentConfig.selectedCodes || []);
      const [defaultCode, setDefaultCode] = useState(currentConfig.defaultCode || '');

      const handleToggleCode = (codeStr) => {
        if (selectedCodes.includes(codeStr)) {
          const updated = selectedCodes.filter(c => c !== codeStr);
          setSelectedCodes(updated);
          if (defaultCode === codeStr) {
            setDefaultCode('');
          }
        } else {
          setSelectedCodes([...selectedCodes, codeStr]);
        }
      };

      const handleSetDefault = (codeStr) => {
        if (!selectedCodes.includes(codeStr)) {
          setSelectedCodes([...selectedCodes, codeStr]);
        }
        setDefaultCode(codeStr);
      };

      const handleSelectAll = () => {
        const allCodes = dimension.subCodes.map(s => s.code);
        setSelectedCodes(allCodes);
      };

      const handleClearAll = () => {
        setSelectedCodes([]);
        setDefaultCode('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-app-card w-full max-w-xl rounded-2xl border border-app-border shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in zoom-in-95 duration-150">
            
            <div className="p-5 bg-gradient-to-r from-amber-600 to-amber-700 text-white flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-mono bg-white/20 px-2 py-0.5 rounded font-bold text-xs">{dimension.id}</span>
                  <h3 className="text-base font-bold">
                    {lang === 'th' ? `กำหนด Sub-Codes: ${dimension.nameTh}` : `Sub-Codes Selection: ${dimension.name}`}
                  </h3>
                </div>
                <p className="text-xs text-amber-100 mt-1">
                  {lang === 'th' ? 'เลือกรายการที่อนุญาต และเลือก Default Code ได้เพียง 1 Code เท่านั้น' : 'Check allowed sub-codes and select exactly 1 Default Code'}
                </p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-white/80 hover:text-white hover:bg-white/10">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="px-5 py-2.5 bg-secondary/60 border-b border-app-border flex items-center justify-between text-xs">
              <span className="font-medium text-muted-foreground">
                Total: <strong>{selectedCodes.length}</strong> / {dimension.subCodes.length} selected
              </span>
              <div className="flex gap-2">
                <button 
                  type="button" 
                  onClick={handleSelectAll} 
                  className="px-2.5 py-1 rounded bg-app-card border border-app-border font-medium hover:bg-accent text-foreground transition"
                >
                  Select All
                </button>
                <button 
                  type="button" 
                  onClick={handleClearAll} 
                  className="px-2.5 py-1 rounded bg-app-card border border-app-border font-medium hover:bg-accent text-foreground transition"
                >
                  Clear All
                </button>
              </div>
            </div>

            <div className="p-5 overflow-y-auto flex-1 divide-y divide-app-border">
              {dimension.subCodes.map(sub => {
                const isChecked = selectedCodes.includes(sub.code);
                const isDefault = defaultCode === sub.code;

                return (
                  <div 
                    key={sub.code} 
                    className={`py-3 px-3 flex items-center justify-between transition rounded-lg ${
                      isChecked ? 'bg-amber-500/5' : ''
                    }`}
                  >
                    <label className="flex items-center gap-3 cursor-pointer flex-1">
                      <input 
                        type="checkbox"
                        checked={isChecked}
                        onChange={() => handleToggleCode(sub.code)}
                        className="rounded text-amber-600 w-4.5 h-4.5"
                      />
                      <div>
                        <div className="text-xs font-mono font-bold text-blue-600 dark:text-blue-400">
                          {sub.code}
                        </div>
                        <div className="text-sm font-medium text-foreground">
                          {sub.name}
                        </div>
                      </div>
                    </label>

                    <div className="pl-3">
                      <button
                        type="button"
                        onClick={() => handleSetDefault(sub.code)}
                        className={`px-3 py-1.5 text-xs font-semibold rounded-lg border transition flex items-center gap-1.5 ${
                          isDefault 
                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                            : 'bg-secondary text-muted-foreground border-app-border hover:bg-accent'
                        }`}
                      >
                        <i data-lucide={isDefault ? "check-circle-2" : "circle"} className="w-3.5 h-3.5"></i>
                        <span>{isDefault ? 'Default Code' : 'Set Default'}</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="p-4 bg-secondary border-t border-app-border flex items-center justify-between">
              <div className="text-xs text-muted-foreground">
                {defaultCode ? (
                  <span>Default Code: <strong className="text-emerald-600">{defaultCode}</strong></span>
                ) : (
                  <span className="italic text-amber-600">* No default code selected</span>
                )}
              </div>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-sm font-medium text-foreground hover:bg-accent rounded-lg transition"
                >
                  {lang === 'th' ? 'ยกเลิก' : 'Cancel'}
                </button>
                <button
                  type="button"
                  onClick={() => onSave(selectedCodes, defaultCode)}
                  className="px-5 py-2 text-sm font-semibold text-white bg-amber-600 hover:bg-amber-700 rounded-lg transition shadow-sm"
                >
                  {lang === 'th' ? 'บันทึก Sub-Codes' : 'Save & Close'}
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    function AccountTreeSelectorModal({ category, lang, onClose, onSelectGroup }) {
      const activeCat = category && MOCK_GROUP_TREE[category] ? category : 'Assets';
      const treeList = MOCK_GROUP_TREE[activeCat] || MOCK_GROUP_TREE['Assets'];

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-app-card w-full max-w-2xl rounded-2xl border border-app-border shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in zoom-in-95 duration-150">
            
            <div className="p-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white flex items-center justify-between">
              <div>
                <h3 className="text-base font-bold flex items-center gap-2">
                  <i data-lucide="folder-tree" className="w-5 h-5"></i>

                </h3>
                <p className="text-xs text-blue-100 mt-1">
                  {lang === 'th' ? 'เลือกโหนดในแผนผังเพื่อกำหนด Group Path ของรหัสบัญชีนี้' : 'Select parent tree node to define structural grouping'}
                </p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-white/80 hover:text-white hover:bg-white/10">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className="p-6 overflow-y-auto flex-1 space-y-4">
              {treeList.map(lvl1 => (
                <div key={lvl1.code} className="space-y-3">
                  
                  {/* Level 1 Node */}

                    <div>
                      <span className="text-[10px] uppercase font-bold text-blue-600 dark:text-blue-400 mr-2">LEVEL 1</span>
                      <span className="font-mono font-bold text-foreground mr-2">{lvl1.code}</span>
                      <span className="font-semibold text-foreground">{lvl1.nameEn} ({lvl1.nameTh})</span>
                    </div>
                    <button
                      onClick={() => onSelectGroup([
                        { level: 1, code: lvl1.code, name: lvl1.nameTh }
                      ], { level: 1, code: lvl1.code, name: lvl1.nameTh })}
                      className="px-3 py-1 text-xs font-semibold rounded bg-blue-600 text-white hover:bg-blue-700 transition"
                    >
                      Select L1
                    </button>
                  </div>

                  {/* Level 2 Nodes */}
                  <div className="pl-6 space-y-3 border-l-2 border-app-border">
                    {lvl1.children?.map(lvl2 => (
                      <div key={lvl2.code} className="space-y-3">
                        <div className="p-3 rounded-lg bg-secondary/60 border border-app-border flex items-center justify-between">
                          <div>
                            <span className="text-[10px] uppercase font-bold text-purple-600 dark:text-purple-400 mr-2">LEVEL 2</span>
                            <span className="font-mono font-bold text-foreground mr-2">{lvl2.code}</span>
                            <span className="font-semibold text-foreground">{lvl2.nameEn} ({lvl2.nameTh})</span>
                          </div>
                          <button
                            onClick={() => onSelectGroup([
                              { level: 1, code: lvl1.code, name: lvl1.nameTh },
                              { level: 2, code: lvl2.code, name: lvl2.nameTh }
                            ], { level: 2, code: lvl2.code, name: lvl2.nameTh })}
                            className="px-3 py-1 text-xs font-semibold rounded bg-purple-600 text-white hover:bg-purple-700 transition"
                          >
                            Select L2
                          </button>
                        </div>

                        {/* Level 3 Nodes */}
                        <div className="pl-6 space-y-2 border-l-2 border-app-border">
                          {lvl2.children?.map(lvl3 => (
                            <div key={lvl3.code} className="space-y-2">
                              <div className="p-2.5 rounded-lg bg-app-card border border-app-border flex items-center justify-between">
                                <div>
                                  <span className="text-[10px] uppercase font-bold text-amber-600 mr-2">LEVEL 3</span>
                                  <span className="font-mono font-bold text-foreground mr-2">{lvl3.code}</span>
                                  <span className="font-medium text-foreground">{lvl3.nameEn} ({lvl3.nameTh})</span>
                                </div>
                                <button
                                  onClick={() => onSelectGroup([
                                    { level: 1, code: lvl1.code, name: lvl1.nameTh },
                                    { level: 2, code: lvl2.code, name: lvl2.nameTh },
                                    { level: 3, code: lvl3.code, name: lvl3.nameTh }
                                  ], { level: 3, code: lvl3.code, name: lvl3.nameTh })}
                                  className="px-2.5 py-1 text-xs font-semibold rounded bg-amber-600 text-white hover:bg-amber-700 transition"
                                >
                                  Select L3
                                </button>
                              </div>

                              {/* Level 4 Nodes */}
                              <div className="pl-6 space-y-1.5 border-l-2 border-app-border">
                                {lvl3.children?.map(lvl4 => (
                                  <div key={lvl4.code} className="p-2 rounded bg-secondary/30 border border-app-border flex items-center justify-between text-xs">
                                    <div>
                                      <span className="text-[10px] uppercase font-bold text-emerald-600 mr-2">LEVEL 4</span>
                                      <span className="font-mono font-bold text-foreground mr-2">{lvl4.code}</span>
                                      <span className="text-foreground">{lvl4.nameEn} ({lvl4.nameTh})</span>
                                    </div>
                                    <button
                                      onClick={() => onSelectGroup([
                                        { level: 1, code: lvl1.code, name: lvl1.nameTh },
                                        { level: 2, code: lvl2.code, name: lvl2.nameTh },
                                        { level: 3, code: lvl3.code, name: lvl3.nameTh },
                                        { level: 4, code: lvl4.code, name: lvl4.nameTh }
                                      ], { level: 4, code: lvl4.code, name: lvl4.nameTh })}
                                      className="px-2.5 py-0.5 text-xs font-semibold rounded bg-emerald-600 text-white hover:bg-emerald-700 transition"
                                    >
                                      Select L4
                                    </button>
                                  </div>
                                ))}
                              </div>

                            </div>
                          ))}
                        </div>

                      </div>
                    ))}
                  </div>

                </div>
              ))}
            </div>

            <div className="p-4 bg-secondary border-t border-app-border flex justify-end">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-sm font-medium text-foreground hover:bg-accent rounded-lg transition"
              >
                {lang === 'th' ? 'ยกเลิก' : 'Cancel'}
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
